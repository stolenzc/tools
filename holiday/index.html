<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>假期倒计时</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Noto+Sans+SC:wght@300;500&display=swap"
        rel="stylesheet">
    <script type="text/javascript" src="/static/js/formatDate.js"></script>
    <script type="text/javascript" src="/static/js/getUrlParams.js"></script>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --bg-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --glass-bg: rgba(255, 255, 255, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            color: #2d3436;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #show_content {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 90%;
            width: 450px;
            transition: transform 0.3s ease;
        }

        @media (hover: hover) and (pointer: fine) {
            #show_content:hover {
                transform: translateY(-5px);
            }
        }

        .label {
            font-size: 0.9rem;
            color: #636e72;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .num_show {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: var(--primary-color);
            display: inline-block;
        }

        #now {
            font-size: 2rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(108, 92, 231, 0.2);
            padding-bottom: 0.5rem;
            white-space: nowrap;
        }

        .target-info {
            font-size: 1.1rem;
            margin: 1.5rem 0;
        }

        #holiday {
            font-weight: 700;
            color: #d63031;
            margin: 0 5px;
        }

        .countdown-container {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 16px;
        }

        #show_day {
            font-size: 2.5rem;
            display: block;
            margin: 0.5rem 0;
            word-wrap: break-word;
        }

        .unit {
            font-size: 1rem;
            color: #636e72;
        }

        .duration-text {
            font-size: 0.75rem;
            color: #b2bec3;
            display: block;
            margin-top: 0.3rem;
        }

        .finish-msg {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00b894;
        }

        .finish-img {
            margin-top: 1rem;
            max-width: 100%;
            border-radius: 0;
        }

        /* 移动端适配 */
        @media screen and (max-width: 768px) {
            body {
                padding: 1rem;
            }

            #show_content {
                width: 100%;
                max-width: 100%;
                padding: 2.5rem 2rem;
                border-radius: 20px;
            }

            #now {
                font-size: 1.6rem;
            }

            .target-info {
                font-size: 1.05rem;
            }

            #show_day {
                font-size: 2.2rem;
                word-break: break-all;
            }
        }

        @media screen and (max-width: 480px) {
            body {
                padding: 0.75rem;
            }

            #show_content {
                padding: 2rem 1.5rem;
                border-radius: 18px;
            }

            #now {
                font-size: 1.3rem;
            }

            .target-info {
                font-size: 1rem;
            }

            .target-info small {
                font-size: 0.85rem;
            }

            #show_day {
                font-size: 2rem;
            }

            .countdown-container {
                padding: 1.2rem;
            }

            .finish-msg {
                font-size: 1.3rem;
            }
        }

        @media screen and (max-width: 360px) {
            body {
                padding: 0.5rem;
            }

            #show_content {
                padding: 1.5rem 1.2rem;
            }

            #now {
                font-size: 1.1rem;
            }

            .target-info {
                font-size: 0.95rem;
            }

            #show_day {
                font-size: 1.8rem;
            }

            .label {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>
    <div id="show_content">
        <span class="label">当前时间</span>
        <span id="now" class="num_show"></span>

        <div class="countdown-container">
            <div class="target-info">
                <span>距离</span>
                <span id="holiday"></span>
                <br>
                <small style="color: #b2bec3;">目标时刻: <span id="endDate"></span></small>
            </div>
            <span class="label">剩余倒计时</span>
            <span id="show_day" class="num_show"></span>
            <span class="unit">秒</span>
            <span id="show_duration" class="num_show duration-text"></span>
        </div>
    </div>

    <script>
        var holiday, endDateStr, end_date, remainSeconds;

        function nextFriday() {
            var now = new Date();
            var week = now.getDay();
            var today = new Date(now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate() + " 00:00:00");
            var friday = 0;
            if (week < 6 && week > 0) {
                friday = today.getTime() + (5 - week) * 24 * 60 * 60 * 1000 + 18 * 60 * 60 * 1000;
            } else {
                // 如果是周六日，指向下周五
                friday = today.getTime() + (12 - week) * 24 * 60 * 60 * 1000 + 18 * 60 * 60 * 1000;
            }
            return new Date(friday);
        }

        function getHolidaySeconds() {
            var now = new Date();
            if (now > end_date) return 0;
            return parseInt((end_date - now) / 1000) + 1;
        }

        function setDateShow() {
            document.getElementById("now").innerText = new Date().Format("yyyy-MM-dd hh:mm:ss");
            document.getElementById("endDate").innerText = end_date.Format("yyyy-MM-dd hh:mm:ss");
        }

        function updateHolidaySeconds() {
            remainSeconds = getHolidaySeconds();
            if (remainSeconds > 0) {
                document.getElementById("show_day").innerText = remainSeconds; // 去除千分位逗号
                document.getElementById("now").innerText = new Date().Format("yyyy-MM-dd hh:mm:ss");

                // 显示剩余的分钟和小时
                const hours = Math.floor(remainSeconds / 3600);
                const minutes = Math.floor((remainSeconds % 3600) / 60);
                const secs = remainSeconds % 60;
                if (hours > 0) {
                    document.getElementById("show_duration").innerText = `${hours}小时${minutes}分钟${secs}秒`;
                } else if (minutes > 0) {
                    document.getElementById("show_duration").innerText = `${minutes}分钟${secs}秒`;
                } else {
                    document.getElementById("show_duration").innerText = `${secs}秒`;
                }

                // 动态同步标题
                var remainDays = parseInt(remainSeconds / 86400);
                document.title = holiday + "倒计时: " + remainDays + "天";
            } else {
                document.getElementById("show_content").innerHTML = `
                    <div class="finish-msg">放假时间到了！</div>
                    <div style="margin-top:10px">快收拾东西回家吧</div>
                    <img class="finish-img" src="/static/img/fly.webp" alt="fly">
                `;
                if (typeof timer !== "undefined") clearInterval(timer);
            }
        }

        function initialLoad() {
            endDateStr = getLocationParams("endDate");
            if (endDateStr == "没有该参数信息") {
                end_date = nextFriday();
            } else {
                end_date = new Date(endDateStr);
            }

            holiday = getLocationParams("holiday");
            if (holiday == "没有该参数信息") {
                holiday = "周末放假";
            }

            document.getElementById("holiday").innerText = holiday;
            setDateShow();
            updateHolidaySeconds();
        }

        initialLoad();
        var timer = setInterval(updateHolidaySeconds, 1000);

    </script>
</body>

</html>
