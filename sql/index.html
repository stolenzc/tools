<style>
    * {

    :root {
        --primary: #6c5ce7;
        --primary-hover: #5a4bd1;

        --text-color: #2d3436;
        --text-muted: #636e72;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        --radius: 12px;
    }

    body {
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0.5rem;
        display: flex;
        background: var(--bg-gradient);
        justify-content: center;
        align-items: center;
        font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: var(--text-color);
    }

    .show_content {
        display: flex;
        align-items: stretch;
        gap: 0.5rem;
        width: 100%;
        width: 100%;
        height: 100%;
        max-height: 98vh;
    }

    .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        min-width: 0;
    }

    .panel-header {
        padding: 0.4rem 0.8rem;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--border-color);
        background: rgba(255, 255, 255, 0.4);
        flex-shrink: 0;
    }

    .show-rough {
        flex: 1;
        width: 100%;
        border: none;
        padding: 0.6rem;
        resize: none;
        font-size: 0.9rem;
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        line-height: 1.5;
        background: transparent;
        color: var(--text-color);
        outline: none;
    }

    .show-rough::placeholder {
        color: #b2bec3;
    }

    .show-rough:focus {
        background: rgba(255, 255, 255, 0.3);
    }

    .operation {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.4rem;
        flex: 0 0 auto;
    }

    button {
        padding: 0.5rem 0.8rem;
        font-size: 0.8rem;
        font-weight: 500;
        font-family: inherit;
        color: #fff;
        background: var(--primary);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(108, 92, 231, 0.25);
    }

    button:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(108, 92, 231, 0.35);
    }

    button:active {
        transform: translateY(0);
        box-shadow: 0 1px 4px rgba(108, 92, 231, 0.2);
    }

    /* 移动端适配 */
    @media screen and (max-width: 768px) {
        body {
            padding: 0.75rem;
        }

        .show_content {
            flex-direction: column;
            gap: 0.8rem;
        }

        .operation {
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0.5rem;
        }

        button {
            flex: 1;
            min-width: 100px;
        }
    }
</style>

<body>

        <div class="panel">

            <button onclick="convert_to_insert()" title="转为insert语句">Insert</button>
            <button onclick="convert_to_insert(include_id=true)" title="转为insert语句(含ID)">Insert(ID)</button>
            <button onclick="download_as_csv()" title="下载为 CSV">CSV</button>
            <button onclick="download_row_as_csv()" title="下载为 CSV(ROW)">CSV(ROW)</button>
        </div>
        <div class="panel">
            <div class="panel-header">输出结果</div>

    </div>

        function deal_line(line_text, python = false, value_is_str = false) {
            // 处理单行数据
            line_text = line_text.trim()
            commonIndex = line_text.indexOf(':')
            if (commonIndex == -1) {
                // 没找到冒号
                return
            }
            // 不考虑sql列名带冒号的情况
            if (line_text.length == commonIndex + 1) {
                // 冒号在字符串结尾
                key = line_text.slice(0, commonIndex)
                value = ""
            } else {
                key = line_text.slice(0, commonIndex)
                value = line_text.slice(commonIndex + 1)
            }
            key = key.trim()
            value = value.trim()

            if (!value_is_str && Number(value).toString() != "NaN" && value != "") {
                // 转换为数字
                value = Number(value)
            }

            if (value == 'NULL') {
                value = null
            }
            if (value == 'true') {
                value = true
            }
            if (value == 'false') {
                value = false
            }

            if (python) {
                if (value === null) {
                    value = 'None'
                }
                if (value === true) {
                    value = 'True'
                }
                if (value === false) {
                    value = 'False'
                }
            }

            return {
                key: key,
                value: value
            }
        }

        function deal_block(line_block, python = false, value_is_str = false) {
            // 处理单个块
            line_block = line_block.trim()
            line_array = line_block.split('\n')
            var result = {}
            for (let i = 0; i < line_array.length; i++) {
                line_text = line_array[i]
                if (line_text == '') {
                    continue
                }
                line_data = deal_line(line_text, python = python, value_is_str = value_is_str)
                if (line_data == undefined) {
                    continue
                }
                result[line_data.key] = line_data.value
            }
            return result
        }

        function deal_data(python = false, original_data = false, value_is_str = false) {
            input_text = document.getElementById('input').value
            var result = new Array()
            input_array = input_text.split(/\*{27} \d+\. row \*{27}\n/)
            for (let i = 0; i < input_array.length; i++) {
                if (input_array[i] == '') {
                    continue
                }
                result.push(deal_block(input_array[i], python = python, value_is_str = value_is_str))
            }
            if (original_data === true) {
                return result
            }
            // 仅一条数据时不包外层 []
            if (result.length === 1) {
                return JSON.stringify(result[0], null, 4)
            }
            return JSON.stringify(result, null, 4)
        }

        function output(data) {
            document.getElementById('output').value = data
        }

        function convert_to_json() {
            output(deal_data())
        }

        function replace_to_python(data) {
            data = data.replace(/: "None"/g, ': None')
            data = data.replace(/: "True"/g, ': True')
            data = data.replace(/: "False"/g, ': False')
            return data
        }

        function convert_to_python() {
            result = deal_data(python = true, original_data = false)
            output(replace_to_python(result))
        }

        function convert_to_python_no_str() {
            // 所有的 value 都按照字符串处理
            result = deal_data(python = true, original_data = false, value_is_str = true)
            output(replace_to_python(result))
        }

        function convert_to_insert(include_id = false) {
            values = ''
            keys = ''
            result = deal_data(python = false, original_data = true)
            for (const item of result) {
                value = ''
                key = ''
                for (var column in item) {
                    if (include_id == false && column == 'id') {
                        continue
                    }

                    data_str = item[column]
                    if (typeof data_str === 'string') {
                        data_str = '"' + data_str + '"'
                    }

                    if (value == '') {
                        value += data_str
                    } else {
                        value += ',' + data_str
                    }

                    if (keys == "") {
                        if (key == '') {
                            key += column
                        } else {
                            key += ',' + column
                        }
                    }
                }
                if (value.length > 0) {
                    value = '(' + value + ')'
                    if (values == "") {
                        values += value
                    } else {
                        values += ',' + value
                    }
                }
            }

            sql = 'INSERT INTO `table_name` (' + key + ') VALUES ' + values + ';'

            output(sql)
        }

        function download_as_csv() {
            result = deal_data(python = false, original_data = true)
            values = ''
            keys = ''
            for (const item of result) {
                key = ''
                value = ''
                for (var column in item) {

                    data_str = item[column]

                    if (value == '') {
                        value += data_str
                    } else {
                        value += ',' + data_str
                    }

                    if (keys == "") {
                        if (key == '') {
                            key += column
                        } else {
                            key += ',' + column
                        }
                    }
                }
                if (value.length > 0) {
                    value = value + "\n"
                    if (values == "") {
                        values += value
                    } else {
                        values += value
                    }
                }
                if (keys == "") {
                    keys = key
                }
            }

            csv = keys + "\n" + values

            download_csv_file(csv)
        }


        function download_row_as_csv() {
            input_text = document.getElementById('input').value
            input_text = input_text.replaceAll(" | ", ",")
            input_text = input_text.replaceAll("| ", "")
            input_text = input_text.replaceAll(" |", "")
            input_text = input_text.replaceAll(" ", "")
            // download_csv_file(csv_data)
            output(input_text)
        }

        function download_csv_file(csv_data) {
            var csv = 'data:text/csv;charset=utf-8,';

            csv += csv_data

            var encodedUri = encodeURI(csv);
            var link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "data.csv");
            document.body.appendChild(link);
            link.click();
        }

        // 复制到剪贴板
        function copy_to_clipboard() {
            var copyText = document.getElementById("output");
            copyText.select();
            document.execCommand("copy");
        }

        // 监听按下 enter 自动转换为 Python 格式的数据
        document.addEventListener('keydown', function(event) {
            if (event.key === "Enter") {
                convert_to_python();
            }
        })

        // 监听页面按下了 ctrl c 或 command c 后自动复制
        document.addEventListener('keydown', function(event) {
            if ((event.ctrlKey || event.metaKey) && event.key === 'c') {
                const activeEl = document.activeElement;
                const isOutput = activeEl === document.getElementById('output');
                // 仅在未聚焦任何输入框，或聚焦在输出框且未选中文本时拦截
                if (!['TEXTAREA', 'INPUT'].includes(activeEl.tagName) ||
                    (isOutput && activeEl.selectionStart === activeEl.selectionEnd)) {
                    event.preventDefault();
                    copy_to_clipboard();
                }
            }
        });

        // 监听页面按下了 ctrl v 或 command v 后自动粘贴 (不会进行粘贴提示弹窗)
        document.addEventListener('paste', function(event) {
            // 获取粘贴的文本内容
            const clipboardData = event.clipboardData || window.clipboardData;
            const pastedText = clipboardData.getData('Text');

            // 将粘贴的文本内容插入到指定输入框
            event.preventDefault(); // 防止默认粘贴行为

            const activeEl = document.activeElement;
            const outputElement = document.getElementById('output');

            const inputElement = document.getElementById('input');

            if (activeEl != inputElement) {
                // 未聚焦在输入框时，清空内容
                inputElement.value = '';
            }

            inputElement.value = inputElement.value + pastedText;
            convert_to_python();
            outputElement.focus();
            outputElement.select();

        });

    </script>
